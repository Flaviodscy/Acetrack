name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS (Simulator & Sideload IPA)
    runs-on: macos-14
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Setup Expo & Prebuild iOS
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🍎 Build iOS App (Archive)
        working-directory: ios
        run: |
          xcodebuild -workspace AceTrack.xcworkspace \
            -scheme AceTrack \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Package App into Payload / IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Release-iphoneos/AceTrack.app build/Payload/
          cd build && zip -r AceTrack.ipa Payload/

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceTrack-iOS-IPA
          path: build/AceTrack.ipa
          retention-days: 30
